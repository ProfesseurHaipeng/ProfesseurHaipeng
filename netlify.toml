[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  # 部署后在 Netlify UI 里覆盖为正式口令
  # ADMIN_PASSWORD = "change-me"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
